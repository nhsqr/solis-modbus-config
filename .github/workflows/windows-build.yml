name: Windows Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Tests
        run: pytest -q

  build:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and build
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm solis-modbus-config.spec
      - uses: actions/upload-artifact@v4
        with:
          name: SolisModbusConfig-windows
          path: dist/SolisModbusConfig.exe
