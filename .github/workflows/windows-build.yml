name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Tests
        run: pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: SolisModbusConfig-windows
          - os: ubuntu-22.04
            artifact: SolisModbusConfig-linux-x64
          - os: macos-latest
            artifact: SolisModbusConfig-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install and build
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm solis-modbus-config.spec
      - name: Package
        shell: bash
        run: |
          mkdir -p out
          case "${{ runner.os }}" in
            Windows) cp dist/SolisModbusConfig.exe out/ ;;
            Linux)   chmod +x dist/SolisModbusConfig && tar -C dist -czf out/SolisModbusConfig-linux-x64.tar.gz SolisModbusConfig ;;
            macOS)   codesign --force --deep --sign - dist/SolisModbusConfig.app && codesign --verify --deep --strict --verbose=2 dist/SolisModbusConfig.app && ditto -c -k --keepParent dist/SolisModbusConfig.app out/SolisModbusConfig-macos-arm64.zip ;;
          esac
          ls -la out
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: out/*

  release:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ls -la assets
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            gh release create "$TAG" assets/* -R "$REPO" --title "$TAG" --generate-notes --verify-tag
          else
            TAG=latest
            gh release delete "$TAG" -R "$REPO" --yes --cleanup-tag || true
            gh release create "$TAG" assets/* -R "$REPO" --target "$GITHUB_SHA" \
              --title "Latest build ($(echo $GITHUB_SHA | cut -c1-7))" \
              --notes "Automatic build from main at ${GITHUB_SHA}." --latest
          fi
